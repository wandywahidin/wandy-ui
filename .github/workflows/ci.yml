name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `changeset status` can diff against main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require a changeset for package source changes
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

      - name: Format
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Verify library dist
        run: pnpm --filter @wandy/ui test:dist

      - name: Build Storybook
        run: pnpm --filter docs build-storybook

      - name: Install Playwright Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Storybook tests (play functions + a11y)
        run: pnpm --filter docs test-storybook
